<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Doctor — audyt repo Python/AI</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --accent:#2ea043; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px; }
  .card { background:var(--card); border:1px solid #30363d; border-radius:12px; padding:24px; margin-bottom:20px; }
  h1 { margin:0 0 8px; font-size:26px; }
  .price { color:var(--accent); font-weight:700; font-size:20px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:var(--text); }
  button { margin-top:14px; background:var(--accent); color:#fff; border:0; padding:12px 18px; border-radius:8px; cursor:pointer; font-weight:600; }
  #chat { height:260px; overflow-y:auto; background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:12px; margin-bottom:10px; }
  .msg { margin:6px 0; padding:8px 12px; border-radius:10px; max-width:80%; }
  .u { background:#1f6feb; margin-left:auto; }
  .b { background:#21262d; }
  .hot { background:#3d1d1d; border:1px solid #f85149; padding:12px; border-radius:8px; margin-top:10px; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Project Doctor</h1>
    <p class="muted">Statyczny audyt Twojego repozytorium Python / C++ / Lua / JS / TS. Raport MD + JSON w 24–48h.</p>
    <p class="price">od 19 € · C++ / Build od 29 €</p>
    <p>Co dostajesz: wynik Project Health 0–100, priorytety naprawy, przegląd testów/CI/sekretów, 5 kroków naprawczych.</p>
  </div>

  <div class="card">
    <h3>Zostaw repo do audytu</h3>
    <label>Email</label><input id="email" placeholder="ty@firma.com">
    <label>Link do repo (lub ZIP)</label><input id="repo" placeholder="https://github.com/...">
    <label>Język audytu</label>
    <select id="lang">
      <option value="python">Python (19 €)</option>
      <option value="cpp">C++ (29 €)</option>
      <option value="build">C++ Build (29 €)</option>
      <option value="winapi">WinAPI Toolkit (29 €)</option>
      <option value="ctf">CTF Pack (19 €)</option>
      <option value="acl">Anti-Cheat Lab (29 €)</option>
      <option value="luahub">Lua Script Hub (19 €)</option>
      <option value="js">JavaScript (19 €)</option>
      <option value="ts">TypeScript (19 €)</option>
    </select>
    <label>Wiadomość</label><textarea id="leadmsg" rows="2"></textarea>
    <button onclick="sendLead()">Wyślij zgłoszenie</button>
  </div>

  <div class="card">
    <h3>Porozmawiaj z nami</h3>
    <div id="chat"></div>
    <input id="chatinput" placeholder="Napisz wiadomość..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">Wyślij</button>
  </div>
</div>

<script>
const CID = "web-" + Math.random().toString(36).slice(2);
function addMsg(text, cls){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; document.getElementById('chat').appendChild(d); document.getElementById('chat').scrollTop=1e9; }
async function sendLead(){
  const body={email:email.value, repo:repo.value, message:leadmsg.value, language:lang.value};
  const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.ok) addMsg('Zgłoszenie przyjęte ('+j.language+', '+j.price+'). Porozmawiaj niżej lub czekaj na kontakt.','b');
}
async function sendChat(){
  const t=chatinput.value; if(!t) return;
  addMsg(t,'u'); chatinput.value='';
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:CID,message:t})});
  const j=await r.json();
  addMsg(j.reply,'b');
  if(j.intent && j.contact){ const h=document.createElement('div'); h.className='hot'; h.innerHTML='<b>Kontakt bezpośredni:</b> '+j.contact.email+'<br><span class="muted">'+j.contact.note+'</span>'; document.getElementById('chat').appendChild(h); }
}
addMsg('Cześć! Project Doctor sprawdzi Twoje repo i da plan naprawy. O co chcesz zapytać?','b');
</script>
</body>
</html>
